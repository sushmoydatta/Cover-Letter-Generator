[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhelper"
version = "2.0.0"
description = "Job Apply Helper: match reports, cover letters, resume tweaks, outreach and interview prep grounded in your real resume."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pypdf>=4.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobhelper = "jobhelper.cli:main"

[tool.setuptools]
packages = ["jobhelper"]

[tool.setuptools.package-data]
jobhelper = ["prompts.json"]
