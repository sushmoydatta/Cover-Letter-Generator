name: Deploy API (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths: ["worker/**", "jobhelper/prompts.json", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test worker
        run: node --test worker/test/worker.test.mjs
      - name: Check Cloudflare secrets are set
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$GROQ" ]; then
            echo "::warning::Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and GROQ_API_KEY repository secrets to deploy the API."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy worker and set the Groq key as a secret
        id: deploy
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            GROQ_API_KEY
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Show API URL
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "### API deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Set the repository variable API_URL to this URL (Settings -> Secrets and variables -> Actions -> Variables), then re-run the Pages workflow." >> "$GITHUB_STEP_SUMMARY"
